name: Run AI YouTube Shorts Generator

on:
  workflow_dispatch:
  schedule:
    # Times are UTC. 08:00 & 15:00 UTC = 1:00 PM & 8:00 PM Pakistan Time (PKT, UTC+5).
    # Adjust these two lines if your audience is in a different timezone.
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # prevents a stuck run from burning Actions minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script (generate + upload to YouTube)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: 'public'
        run: |
          python main.py

      # Without this step the finished video is deleted the moment the
      # runner is torn down. This uploads it so you can download it from
      # the workflow run's "Artifacts" section.
      - name: Upload Generated Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: |
            output/*.mp4
            assets/final/*.mp4
          if-no-files-found: warn
          retention-days: 7
