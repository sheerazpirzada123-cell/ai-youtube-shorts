name: Run AI YouTube Shorts Generator

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # prevents a stuck run from burning Actions minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      # Without this step the finished video is deleted the moment the
      # runner is torn down. This uploads it so you can download it from
      # the workflow run's "Artifacts" section.
      - name: Upload Generated Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: |
            output/*.mp4
            assets/final/*.mp4
          if-no-files-found: warn
          retention-days: 7
