name: Auto YouTube Shorts Generator

on:
  # Auto-run twice a day at good engagement times for a Pakistan/India (PKT/IST)
  # audience: ~1:30 PM and ~8:30 PM local time (lunchtime + evening scroll time).
  # Cron times below are in UTC: 08:30 UTC = 1:30 PM PKT, 15:30 UTC = 8:30 PM PKT.
  schedule:
    - cron: '30 8,15 * * *'
  workflow_dispatch: # Manual run button ke liye

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Post Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Numba error fix karne ke liye Python 3.10[cite: 1]
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # ImageMagick's default security policy blocks some operations moviepy's
          # TextClip needs (used for the on-screen captions) - relax it here.
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Short Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Set to "true" (as a repo Variable, Settings > Secrets and variables > Actions > Variables)
          # once you want real uploads to go live. Defaults to false = dry run.
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
        run: |
          python main.py

      - name: Upload Output Video as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-short-video
          path: final_short.mp4
          retention-days: 1
