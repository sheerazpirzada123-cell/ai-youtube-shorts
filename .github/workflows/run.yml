name: Auto YouTube Shorts Generator

on:
  schedule:
    - cron: '0 4,16 * * *' # Rozana do baar auto-run hoga
  workflow_dispatch: # Manual run button ke liye

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Post Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Numba error fix karne ke liye Python 3.10[cite: 1]
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Short Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Upload Output Video as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-short-video
          path: output.mp4
          retention-days: 1
